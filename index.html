<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hi</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        align-items: center;
        background-color: black;
        display: flex;
        font-family: arial;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
      }

      p {
        text-align: center;
        padding: 0.25rem;
        margin: 0;
      }

      #text2 {
        list-style: none;
        margin-top: 0.25rem;
        margin-bottom: 0;
        padding: 0.25rem;
        text-align: center;
      }

      #text2 li + li {
        margin-top: 0.5rem;
      }

      .small-text {
        font-size: smaller;
      }

      .items {
        align-items: center;
        background-color: white;
        border-radius: 1rem;
        display: flex;
        flex-direction: column;
        padding: 1rem;
        row-gap: 0.25rem;
        width: 15em;
      }

      h3 {
        margin: 0;
      }

      .fade-slow {
        animation: shownum 0.5s forwards;
        opacity: 0;
      }

      @keyframes shownum {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      .ok {
        position: absolute;
        opacity: 0.01;
        color: black;
        z-index: -1;
      }
    </style>

    <script defer>
      document.addEventListener("contextmenu", (event) =>
        event.preventDefault()
      );

      const loadTime = new Date().toLocaleString([], { timeZone: "UTC" });
      document.getElementById("pre").textContent = `${loadTime} UTC`;

      const observations = document.getElementById("text2");
      const messages = [observations.textContent.trim()];
      const params = new URLSearchParams(window.location.search);

      if (params.has("fbclid")) {
        messages.push("Instagram or Facebook referral detected");
      }

      observations.replaceChildren(
        ...messages.map((message) => {
          const item = document.createElement("li");
          item.textContent = message;
          return item;
        })
      );

    </script>
  </head>

  <body>
    <div class="element ok">
      <h1>Kyle Saburao</h1>
      <p>This is a website about Kyle Saburao</p>
      <p id="pre"></p>
    </div>

    <div class="items fade-slow">
      <h3>Hi</h3>
      <ul id="text2" class="small-text" aria-label="Observations">
        <li>Your visit and identifying information have been tracked by Cloudflare</li>
      </ul>
    </div>
  </body>
</html>
