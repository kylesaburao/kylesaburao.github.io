<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      const destination = new URL("REDACTED");
      destination.search = window.location.search;
      const redirectDelay = 1500 + (Math.random() * 0.5 - 0.25) * 1000;
      window.setTimeout(() => window.location.replace(destination), redirectDelay);
    </script>
    <title>Redirecting...</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0d0f14;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .redirect-status {
        display: grid;
        justify-items: center;
        gap: 0.875rem;
        color: #f7f7f7;
        text-align: center;
      }
      .spinner {
        width: 2rem;
        height: 2rem;
        border: 2px solid rgb(247 247 247 / 25%);
        border-top-color: #f7f7f7;
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }
      p {
        margin: 0;
        font-size: clamp(1.5rem, 4vw, 1.75rem);
        font-weight: 700;
        letter-spacing: -0.035em;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <section class="redirect-status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Your visit has been tracked...</p>
    </section>
  </body>
</html>
